# =============================================================================
# .gitlab-ci.yml — пайплайн монорепозитория MarketSniperMVP
#
# Принципы:
#   - избирательность (монорепо): джобы .NET запускаются только при изменениях
#     в backend/, фронтовые — в frontend/, образы — при изменениях docker/;
#   - compare_to обязателен: без него rules:changes на новой ветке всегда истинно,
#     и пайплайн делает всю работу впустую;
#   - exists-условие: пока решения/приложения не созданы, джобы просто не появляются
#     (пайплайн не красный «на пустом месте»);
#   - один пайплайн на изменение: workflow.rules отсекает двойные пайплайны на MR;
#   - только бесплатные инструменты: SAST и Secret Detection (GitLab Free),
#     Container Scanning (Free, Trivy), Trivy/Grype для зависимостей
#     (встроенный Dependency Scanning требует Ultimate).
#
# Локальный аналог проверок — AGENTS.md §12, детали — docs/architecture/ci-cd.md.
# =============================================================================

stages:
  - build
  - test
  - security
  - package
  - deploy

variables:
  GIT_DEPTH: "20"
  NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  # Образы сканирования и сборки
  CS_IMAGE: "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA"
  CS_SEVERITY_THRESHOLD: "high"
  SAST_EXCLUDED_PATHS: "node_modules,dist,bin,obj,TestResults,**/*.Designer.cs,**/*.lock.json"

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"

include:
  # Наши шаблоны (условия запуска заданы внутри джобов)
  - local: 'ci/templates/dotnet.yml'
  - local: 'ci/templates/frontend.yml'
  - local: 'ci/templates/docker.yml'
  - local: 'ci/templates/security.yml'
  # Шаблоны GitLab (доступны в Free-тире)
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Container-Scanning.gitlab-ci.yml

# Container Scanning из шаблона GitLab: переносим в стадию security и связываем
# со сборкой образа. Остальные ключи джоба берёт из шаблона (deep merge).
container_scanning:
  stage: security
  needs: ["docker:backend"]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      exists:
        - 'docker/backend/Dockerfile'

# --- Миграции БД (заготовка; включается вместе с сервером) -------------------
# Миграции применяются ОТДЕЛЬНЫМ шагом до выкатки приложения (решение и обоснование —
# docs/architecture/ci-cd.md): видны в пайплайне, отдельный лог, нет гонки между репликами.
# В локальном контуре ту же роль играет pre_start с per_replica: false.
deploy:migrate:
  stage: deploy
  image: docker:29.7.2-cli
  interruptible: false
  environment:
    name: staging
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $DEPLOY_HOST
      when: manual
      allow_failure: false
    - when: never
  script:
    - echo "Заготовка: применение миграций на стенде."
    - echo "План: docker compose run --rm backend dotnet MarketSniper.Web.dll --migrate"
    - echo "Реализация появится вместе с целевым сервером (\$DEPLOY_HOST)."

# --- Деплой (заготовка; включается вручную) ---------------------------------
deploy:staging:
  stage: deploy
  image: docker:29.7.2-cli
  interruptible: false
  environment:
    name: staging
    url: https://staging.marketsniper.local
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  script:
    - echo "Заготовка: развёртывание staging-контура."
    - echo "План: docker compose -f docker/compose/compose.yaml --env-file .env --profile app pull"
    - echo "      docker compose -f docker/compose/compose.yaml --env-file .env --profile app up -d"
    - echo "Реализация появится вместе с целевым сервером (docs/architecture/ci-cd.md)."
