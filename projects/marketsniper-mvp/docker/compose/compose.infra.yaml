# =============================================================================
# compose.infra.yaml — инфраструктура (постgres + redis)
#
# Обязательный минимум для локальной разработки и для запуска приложений.
# Запуск:  docker compose -f docker/compose/compose.infra.yaml --env-file .env up -d
# =============================================================================
name: marketsniper

services:
  postgres:
    # Точный пин (docs/adr/0012): 18.6 от 2026-08-15.
    # index-digest: sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    image: postgres:18.6-alpine
    # up не подменяет локальный образ: обновление — только явным `docker compose pull postgres`
    pull_policy: missing
    container_name: marketsniper-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-marketsniper_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      # Единый часовой пояс — иначе timestamps в БД и в логах расходятся
      TZ: ${TZ:-Europe/Moscow}
      PGTZ: ${TZ:-Europe/Moscow}
    ports:
      - "${POSTGRES_HOST_PORT:-5435}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-marketsniper_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - marketsniper-net
    # Ограничения — чтобы БД не съедала всю память dev-машины
    shm_size: 256mb

  redis:
    # Точный пин (docs/adr/0012): 8.10.1 от 2026-08-20.
    # index-digest: sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
    image: redis:8.10.1-alpine
    pull_policy: missing
    container_name: marketsniper-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
    environment:
      TZ: ${TZ:-Europe/Moscow}
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - marketsniper-net

volumes:
  postgres-data:
    name: marketsniper-postgres-data
  redis-data:
    name: marketsniper-redis-data

networks:
  marketsniper-net:
    name: marketsniper-net
    driver: bridge
