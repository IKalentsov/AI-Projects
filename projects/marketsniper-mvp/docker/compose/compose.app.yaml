# =============================================================================
# compose.app.yaml — приложения (backend + frontend + reverse-proxy)
#
# СТАТУС: заготовка. Включается профилем `app` и заработает после того,
# как появятся backend/Dockerfile и frontend/Dockerfile (см. docker/README.md).
#
# Запуск:  docker compose -f docker/compose/compose.app.yaml --profile app \
#            --env-file .env up -d --build
# =============================================================================
name: marketsniper

services:
  backend:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: docker/backend/Dockerfile
      target: runtime
      args:
        # Версия SDK фиксируется, чтобы сборка была воспроизводимой
        DOTNET_VERSION: "10.0"
    image: marketsniper/backend:${IMAGE_TAG:-dev}
    # container_name НЕ задаём: он запрещает масштабирование сервиса (docker compose --scale)
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_HTTP_PORTS: "8080"
      TZ: ${TZ:-Europe/Moscow}
      ConnectionStrings__Default: ${ConnectionStrings__Default}
      ConnectionStrings__Redis: ${ConnectionStrings__Redis}
      # Наблюдаемость: единый транспорт OTLP (dev — Aspire Dashboard, prod — Grafana/OTel Collector)
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://aspire-dashboard:18889}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      OTEL_SERVICE_NAME: marketsniper-backend
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=${APP_ENV:-Development}
      # Секреты внешних API — только через окружение
      Marketplace__Ozon__ClientId: ${MARKETPLACE_OZON_CLIENT_ID:-}
      Marketplace__Ozon__ApiKey: ${MARKETPLACE_OZON_API_KEY:-}
      Marketplace__Wildberries__ApiKey: ${MARKETPLACE_WILDBERRIES_API_KEY:-}
      Marketplace__Yandex__ApiKey: ${MARKETPLACE_YANDEX_API_KEY:-}
    expose:
      - "8080"
    # Публикация порта — только для удобства отладки.
    # ВНИМАНИЕ: при масштабировании (`--scale backend=3`) фиксированный порт даст конфликт.
    # Для реплик: убрать ports (трафик идёт через proxy) либо задать диапазон "8080-8089:8080".
    ports:
      - "${BACKEND_HOST_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # curl добавляется в runtime-слой Dockerfile (в базовом образе .NET его нет)
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health/live"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - marketsniper-net

  frontend:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: docker/frontend/Dockerfile
      target: runtime
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api/v1}
    image: marketsniper/frontend:${IMAGE_TAG:-dev}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Moscow}
    expose:
      - "8080"
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # Caddy-образ на alpine: busybox wget доступен
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - marketsniper-net

  # Единая точка входа: /api → backend, всё остальное → frontend (SPA)
  proxy:
    profiles: ["app", "proxy"]
    image: caddy:2.11.4-alpine
    container_name: marketsniper-proxy
    restart: unless-stopped
    ports:
      - "${PROXY_HTTP_PORT:-80}:80"
    volumes:
      - ../proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      TZ: ${TZ:-Europe/Moscow}
      BACKEND_UPSTREAM: backend:8080
      FRONTEND_UPSTREAM: frontend:8080
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - marketsniper-net

volumes:
  caddy-data:
    name: marketsniper-caddy-data
  caddy-config:
    name: marketsniper-caddy-config

networks:
  marketsniper-net:
    name: marketsniper-net
    external: true
