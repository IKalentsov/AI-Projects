# =============================================================================
# ci/templates/security.yml — проверки безопасности (только бесплатные средства)
#
# Что доступно в GitLab Free: SAST, Secret Detection, Container Scanning
# (см. .gitlab-ci.yml). Встроенный Dependency Scanning требует Ultimate,
# поэтому SCA закрываем Trivy/Grype — здесь.
#
# Философия: проверяем то, что можно исправить. Флаги:
#   --ignore-unfixed — иначе пайплайн вечно красный из-за CVE базовых образов,
#                      для которых ещё нет исправленных версий;
#   --exit-code 1 только на HIGH/CRITICAL.
# =============================================================================

# --- SCA: уязвимости зависимостей (.NET + Node) ------------------------------
security:dependencies:
  image: aquasec/trivy:0.74.0
  stage: security
  interruptible: true
  variables:
    TRIVY_NO_PROGRESS: "true"
    TRIVY_CACHE_DIR: "$CI_PROJECT_DIR/.trivycache"
  cache:
    key: trivy-db
    paths:
      - .trivycache/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        compare_to: 'refs/heads/main'
        paths:
          - 'backend/Directory.Packages.props'
          - 'backend/**/packages.lock.json'
          - 'frontend/pnpm-lock.yaml'
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"
  script:
    - trivy --version
    # Сканируем файловую систему проекта: lock-файлы дают точный список версий
    - >
      trivy fs
      --scanners vuln
      --severity HIGH,CRITICAL
      --ignore-unfixed
      --exit-code 1
      --format sarif
      --output trivy-fs.sarif
      .
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - trivy-fs.sarif

# --- SBOM: состав зависимостей как артефакт ----------------------------------
security:sbom:
  image: anchore/syft:v1.51.1
  stage: security
  interruptible: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  script:
    - syft dir:. --output cyclonedx-json=sbom.cdx.json --output spdx-json=sbom.spdx.json
  artifacts:
    name: "sbom-$CI_COMMIT_SHORT_SHA"
    expire_in: 4 weeks
    paths:
      - sbom.cdx.json
      - sbom.spdx.json

# --- SonarQube Community Build: анализ по расписанию (MR не блокирует) --------
# Запускается только если в настройках проекта заданы SONAR_HOST_URL и SONAR_TOKEN
# (Settings → CI/CD → Variables, masked/protected) и только по расписанию:
# в Community Build нет PR-анализа и quality gate, поэтому гейт на MR выполняют
# тесты, анализаторы и dotnet format. Решение — docs/architecture/ci-cd.md.
sonar:analysis:
  image: mcr.microsoft.com/dotnet/sdk:10.0.401-noble
  stage: security
  interruptible: true
  allow_failure: true
  cache:
    key:
      files:
        - backend/Directory.Packages.props
    paths:
      - .nuget/packages
  variables:
    NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SONAR_HOST_URL && $SONAR_TOKEN
    - when: never
  script:
    - dotnet tool install --global dotnet-sonarscanner
    - export PATH="$PATH:$HOME/.dotnet/tools"
    - cd backend
    # ВНИМАНИЕ: свойство покрытия зависит от версии SonarQube (opencover / cobertura) —
    # уточнить при настройке сервера и добавить соответствующий /d:sonar.cs.*.reportsPaths.
    - >
      dotnet sonarscanner begin
      /k:"$CI_PROJECT_PATH_SLUG"
      /n:"$CI_PROJECT_TITLE"
      /d:sonar.token="$SONAR_TOKEN"
      /d:sonar.host.url="$SONAR_HOST_URL"
    - dotnet build -c Release --no-incremental
    - >
      dotnet test --solution MarketSniper.slnx -c Release
      -- --coverage --coverage-output-format cobertura --results-directory TestResults
    - dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

# --- Заготовка: подпись образов (включать, когда появится контур верификации) -
# cosign/sigstore — Apache-2.0, keyless через OIDC GitLab.
# Пока нет admission-контроллера, который проверяет подпись, это оверинжиниринг.
security:sign:
  image: ghcr.io/sigstore/cosign/cosign:v3.1.3
  stage: security
  rules:
    - when: never
  script:
    - cosign sign --yes "$CI_REGISTRY_IMAGE/backend@$CI_REGISTRY_IMAGE_BACKEND_DIGEST"
    - cosign attest --yes --predicate sbom.cdx.json --type cyclonedx "$CI_REGISTRY_IMAGE/backend@$CI_REGISTRY_IMAGE_BACKEND_DIGEST"
